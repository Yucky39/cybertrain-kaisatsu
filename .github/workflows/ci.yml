name: CI

on:
  push:
  pull_request:

env:
  # The CyberTrain release spin.toml depends on. Its CLI installs the Spinel
  # release it pins (Cybertrain::SPINEL_TAG in cybertrain/version.rb).
  CYBERTRAIN_TAG: "v0.3.1"
  SPINEL_TAG: "2026.10.27.7020"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install SQLite, zlib and OpenSSL headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev zlib1g-dev libssl-dev

      - name: Point the compiler at Homebrew openssl (macOS)
        if: runner.os == 'macOS'
        run: |
          prefix=$(brew --prefix openssl@3)
          echo "LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          echo "CPATH=$prefix/include" >> "$GITHUB_ENV"

      - name: Fetch the CyberTrain CLI
        run: git clone --depth 1 --branch "$CYBERTRAIN_TAG" https://github.com/saeki-mototsune/cybertrain.git "$RUNNER_TEMP/cybertrain"

      - name: Name the runner image
        id: image
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-0}" >> "$GITHUB_OUTPUT"

      - name: Restore the Spinel toolchain
        id: spinel-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cybertrain
          key: spinel-${{ env.SPINEL_TAG }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.id }}

      - name: Install Spinel (cybertrain setup)
        run: ruby -I"$RUNNER_TEMP/cybertrain" "$RUNNER_TEMP/cybertrain/exe/cybertrain" setup

      - name: Save the Spinel toolchain
        if: steps.spinel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cybertrain
          key: spinel-${{ env.SPINEL_TAG }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.id }}

      - name: The installer (CRuby)
        run: script/check-installer

      - name: Tests under Spinel
        run: |
          export PATH="$HOME/.cybertrain/spinel/$SPINEL_TAG/bin:$PATH"
          spin test
